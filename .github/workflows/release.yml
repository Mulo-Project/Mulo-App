name: Release

# v* 태그를 push하면 서명된 release APK를 빌드해 GitHub Release에 올린다 (Play 스토어 아님).
# 필요한 Secrets: docs/release.md
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    name: 서명 APK 빌드 · Release 업로드
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MULO_REQUIRE_RELEASE_SIGNING: 'true'
      MULO_KEYSTORE_PASSWORD: ${{ secrets.MULO_KEYSTORE_PASSWORD }}
      MULO_KEY_ALIAS: ${{ secrets.MULO_KEY_ALIAS }}
      MULO_KEY_PASSWORD: ${{ secrets.MULO_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: 태그에서 버전 계산
        id: ver
        run: |
          # 태그만 올리면 된다: v1.0.1 → 버전 이름 1.0.1, 버전 번호(versionCode)는 Actions 실행 번호(항상 커진다).
          tag="${GITHUB_REF_NAME}"
          if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::태그 형식이 맞지 않습니다: ${tag} (예: v1.0.1, v1.0.1-rc1)"
            exit 1
          fi
          name="${tag#v}"; name="${name%%-*}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          pre=false; case "$tag" in *-*) pre=true;; esac
          echo "prerelease=${pre}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x # 개발 PC의 Flutter와 맞춘다. 올릴 때 docs/release.md 확인
          cache: true
      - run: flutter pub get

      - name: 서명 키와 빌드 설정값 준비
        env:
          KEYSTORE_B64: ${{ secrets.MULO_KEYSTORE_BASE64 }}
          DART_DEFINES: ${{ secrets.MULO_DART_DEFINES }}
        run: |
          for v in KEYSTORE_B64 DART_DEFINES MULO_KEYSTORE_PASSWORD MULO_KEY_ALIAS MULO_KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then echo "::error::Secret ${v} 이(가) 비어 있습니다 (docs/release.md)"; exit 1; fi
          done
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mulo-release.jks"
          printf '%s' "$DART_DEFINES" > "$RUNNER_TEMP/dart_defines.json"
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$RUNNER_TEMP/dart_defines.json"
          echo "MULO_KEYSTORE_FILE=$RUNNER_TEMP/mulo-release.jks" >> "$GITHUB_ENV"

      - name: release APK 빌드 (arm64)
        run: |
          flutter build apk --release --flavor full --split-per-abi --target-platform android-arm64 \
            --build-name="${{ steps.ver.outputs.name }}" --build-number="${{ steps.ver.outputs.number }}" \
            --dart-define-from-file="$RUNNER_TEMP/dart_defines.json"

      - name: 서명 확인 (debug 키면 실패)
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          mkdir -p dist
          # 사용자가 받을 파일은 하나: dist/Mulo.apk (64비트 arm64, 요즘 폰 거의 전부). 32비트 · x86_64는 올리지 않는다.
          f="build/app/outputs/flutter-apk/app-arm64-v8a-full-release.apk"
          [ -f "$f" ] || { echo "::error::arm64 APK가 없습니다: $f"; exit 1; }
          out="$("$apksigner" verify --print-certs "$f")"
          echo "$out"
          if echo "$out" | grep -qi "Android Debug"; then echo "::error::debug 키로 서명됐습니다"; exit 1; fi
          cp "$f" dist/Mulo.apk
          ls -lh dist
          sha256sum dist/Mulo.apk | tee "$RUNNER_TEMP/sha256.txt"

      - name: GitHub Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          flags=""
          [ "$PRERELEASE" = "true" ] && flags="--prerelease"
          sha="$(cut -d' ' -f1 "$RUNNER_TEMP/sha256.txt")"
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## 설치 방법
          아래 **Assets**의 \`Mulo.apk\` 하나를 받아 설치하세요.
          - 처음 설치할 때는 "출처를 알 수 없는 앱" 허용이 필요할 수 있습니다.
          - 이전 버전이 있으면 그대로 덮어 설치(업데이트)됩니다.
          - 64비트 폰(2017년 이후 갤럭시 · 픽셀 등 거의 모든 폰)용입니다.
          - 파일 확인용 SHA-256: \`${sha}\`

          NOTES
          gh release create "$GITHUB_REF_NAME" dist/Mulo.apk \
            --title "Mulo ${GITHUB_REF_NAME}" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes $flags
